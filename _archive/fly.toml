# fly.toml app configuration file generated for gemma-rag-api

app = "gemma-rag-api-demo"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "chroma_data"
  destination = "/chroma"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
